<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Snake Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #578a34; /* Darker green background */
            font-family: 'Arial', sans-serif;
            color: white;
            width: 550px;
            height: 500px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-board {
            display: flex;
            justify-content: space-between; /* Align items to ends */
            align-items: center;
            width: 510px; /* Slightly wider than canvas for padding */
            padding: 5px 15px; /* Vertical and horizontal padding */
            margin-bottom: 10px; /* Space between score and canvas */
            font-size: 24px;
            font-weight: bold;
        }

        .score-item {
            display: flex;
            align-items: center;
        }

        .score-item span {
            margin-left: 8px; /* Space between icon and number */
        }

        #gameCanvas {
            border: 10px solid #4a752c; /* Border similar to image */
            background-color: #a2d149; /* Lighter green for game area */
            /* Checkered background using gradient */
            background-image: linear-gradient(45deg, #b0d953 25%, transparent 25%),
                              linear-gradient(-45deg, #b0d953 25%, transparent 25%),
                              linear-gradient(45deg, transparent 75%, #b0d953 75%),
                              linear-gradient(-45deg, transparent 75%, #b0d953 75%);
            background-size: 40px 40px; /* Size of the checkered squares */
            background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
            display: block; /* Remove extra space below canvas */
        }

         /* Simple modal for Game Over */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 1; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0,0,0,0.6); /* Black w/ opacity */
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .modal-content {
            background-color: #4a752c;
            padding: 30px;
            border: 1px solid #888;
            border-radius: 10px;
            color: white;
            font-size: 24px;
        }

        .modal-content button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #a2d149;
            border: none;
            border-radius: 5px;
            color: #333;
            font-weight: bold;
        }
         .modal-content button:hover {
             background-color: #b0d953;
         }
    </style>

 

</head>
<body>
    <a href="https://googlesnake.org/" target="_blank" style="position: absolute;
    bottom: 0px; color: white;">Google Snake</a> 
          <a class="back" id="rate" target="_blank" href="#" style="    position: absolute;
    top: 0px; color: white;"> Please Rate Us! </a>
        
    <div class="game-container">
        <div class="score-board">
            <div class="score-item">
                🍎<span id="currentScore">0</span>
            </div>
            <div class="score-item">
                🏆<span id="highScore">0</span>
            </div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="modal">
        <div class="modal-content">
            <h2>Game Over!</h2>
            <p>Your Score: <span id="finalScore">0</span></p>
            <p>High Score: <span id="modalHighScore">0</span></p>
            <button id="restartButton">Play Again</button>
        </div>
    </div>


    <script src="snake.js">


    </script>
    <script src="rate.js"></script>
</body>
</html>
